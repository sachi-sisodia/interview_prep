<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one passbook column — balance slip on top, entry pad, then the ledger and the self-checks. */
:root {
  --paper: #eef3f0;
  --sheet: #ffffff;
  --ink: #12302a;
  --muted: #5d7570;
  --rule: #cfdcd7;
  --accent: #0f6b55;
  --accent-ink: #ffffff;
  --credit: #0f6b55;
  --debit: #a8402c;
  --debit-soft: #f7e4df;
  --credit-soft: #dcefe8;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
  --f-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1715; --sheet: #15221f; --ink: #e3eeea; --muted: #8fa8a1; --rule: #28403a;
  --accent: #4fc4a2; --accent-ink: #062019; --credit: #5fd3b0; --debit: #f08a73;
  --debit-soft: #3a211b; --credit-soft: #163a30; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0d1715; --sheet: #15221f; --ink: #e3eeea; --muted: #8fa8a1; --rule: #28403a;
  --accent: #4fc4a2; --accent-ink: #062019; --credit: #5fd3b0; --debit: #f08a73;
  --debit-soft: #3a211b; --credit-soft: #163a30; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 17px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
main { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: .02em; }
h2 { font-size: 1.05rem; font-weight: 600; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

.slip {
  background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 24px 24px 20px;
  display: grid; gap: 4px;
}
.slip .label { color: inherit; opacity: .8; }
.balance { font-family: var(--f-num); font-size: clamp(2.6rem, 9vw, 4rem); font-weight: 600; line-height: 1.1; overflow-wrap: anywhere; }
.slip-foot { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; opacity: .85; }

.pad { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.amount-row { display: flex; align-items: center; gap: 8px; border: 2px solid var(--rule); border-radius: 12px; padding: 4px 14px; background: var(--paper); }
.amount-row:focus-within { border-color: var(--accent); }
.amount-row span { font-family: var(--f-num); font-size: 1.6rem; color: var(--muted); }
#amount { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 600 1.8rem var(--f-num); padding: 10px 0; outline: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 600 .9rem var(--f-num); cursor: pointer; min-height: 40px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 12px; min-height: 56px; font: 700 1.05rem var(--f-body); cursor: pointer; }
.btn-in { background: var(--accent); color: var(--accent-ink); }
.btn-out { background: var(--debit-soft); color: var(--debit); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:active { transform: translateY(1px); }
.msg { min-height: 1.5em; font-size: .95rem; margin: 0; }
.msg.err { color: var(--debit); font-weight: 700; }
.msg.ok { color: var(--credit); }

.ledger { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 8px 20px 12px; }
.ledger-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; gap: 12px; }
.link { background: none; border: 0; color: var(--muted); font: 600 .85rem var(--f-body); text-decoration: underline; cursor: pointer; padding: 8px 0; }
ol.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; border-top: 1px dashed var(--rule); }
.tag { font: 700 .7rem var(--f-num); padding: 3px 8px; border-radius: 6px; letter-spacing: .06em; }
.tag.in { background: var(--credit-soft); color: var(--credit); }
.tag.out { background: var(--debit-soft); color: var(--debit); }
.row time { color: var(--muted); font-size: .85rem; min-width: 0; }
.row .amt { text-align: right; font-weight: 600; }
.row .amt.in { color: var(--credit); }
.row .amt.out { color: var(--debit); }
.row .run { grid-column: 3; text-align: right; color: var(--muted); font-size: .8rem; }
.empty { color: var(--muted); padding: 16px 0; border-top: 1px dashed var(--rule); margin: 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
.confirm button { min-height: 36px; border-radius: 8px; padding: 0 12px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 600 .85rem var(--f-body); cursor: pointer; }
.confirm .danger { background: var(--debit); color: var(--sheet); border-color: var(--debit); }

details.checks { background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 4px 20px; }
details.checks summary { cursor: pointer; padding: 14px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; list-style: none; }
details.checks summary::-webkit-details-marker { display: none; }
.score { font: 600 .85rem var(--f-num); padding: 4px 10px; border-radius: 999px; background: var(--credit-soft); color: var(--credit); }
.score.bad { background: var(--debit-soft); color: var(--debit); }
ul.tests { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 6px; }
ul.tests li { display: grid; grid-template-columns: 1.5em 1fr; gap: 8px; font: .85rem/1.4 var(--f-num); overflow-wrap: anywhere; }
ul.tests .pass { color: var(--credit); } ul.tests .fail { color: var(--debit); }
.note { color: var(--muted); font-size: .85rem; margin: 0 0 14px; max-width: 65ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main>
  <header>
    <h1>Pocket Ledger</h1>
    <span class="label">Account · USD · on this device</span>
  </header>

  <section class="slip" aria-live="polite">
    <span class="label">Available balance</span>
    <div class="balance" id="balance">$0.00</div>
    <div class="slip-foot"><span id="count">0 entries</span><span id="totals"></span></div>
  </section>

  <form class="pad" id="pad" autocomplete="off">
    <label class="label" for="amount">Amount</label>
    <div class="amount-row"><span>$</span><input id="amount" inputmode="decimal" placeholder="0.00" aria-describedby="msg"></div>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-v="5">5.00</button>
      <button type="button" class="chip" data-v="20">20.00</button>
      <button type="button" class="chip" data-v="50">50.00</button>
      <button type="button" class="chip" data-v="100">100.00</button>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-in" id="dep" data-act="deposit">Deposit</button>
      <button type="button" class="btn btn-out" id="wd" data-act="withdraw">Withdraw</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <section class="ledger">
    <div class="ledger-head">
      <h2>Ledger</h2>
      <div id="resetArea"><button type="button" class="link" id="reset">Start a new account</button></div>
    </div>
    <ol class="rows" id="rows"></ol>
  </section>

  <details class="checks" id="checks">
    <summary><h2>Self-checks</h2><span class="score" id="score">…</span></summary>
    <p class="note">The same eight cases as <code>test_account.py</code>, run against this page's account logic each time it loads.</p>
    <ul class="tests" id="tests"></ul>
  </details>
</main>

<script>
// Port of account.py. Amounts are held as integer cents (BigInt) so 3.10 + 3.20 is exactly 6.30,
// the same guarantee Python's Decimal gives.
class Account {
  constructor() { this.cents = 0n; }
  deposit(amount) {
    const c = Account.toCents(amount);
    if (c <= 0n) throw new Error("Deposit amount must be positive");
    this.cents += c;
  }
  withdraw(amount) {
    const c = Account.toCents(amount);
    if (c <= 0n) throw new Error("Withdrawal amount must be positive");
    if (c > this.cents) throw new Error("Insufficient funds");
    this.cents -= c;
  }
  getBalance() { return Account.format(this.cents); }
  static toCents(amount) {
    const m = String(amount).trim().match(/^([+-]?)(\d*)(?:\.(\d*))?$/);
    if (!m || (m[2] === "" && !m[3])) throw new Error("Invalid amount");
    if ((m[3] || "").length > 2) throw new Error("Use at most 2 decimal places");
    const c = BigInt(m[2] || "0") * 100n + BigInt((m[3] || "").padEnd(2, "0"));
    return m[1] === "-" ? -c : c;
  }
  static format(c, grouped = false) {
    const neg = c < 0n; if (neg) c = -c;
    let s = (c / 100n).toString();
    if (grouped) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (neg ? "-" : "") + s + "." + (c % 100n).toString().padStart(2, "0");
  }
}

// ---- self-checks mirroring test_account.py ----
function raises(fn, match) {
  try { fn(); } catch (e) { if (match && !e.message.includes(match)) throw new Error(`raised "${e.message}"`); return; }
  throw new Error("did not raise");
}
function eq(a, b) { if (a !== b) throw new Error(`expected ${b}, got ${a}`); }
const TESTS = {
  test_initial_balance_is_zero() { eq(new Account().getBalance(), "0.00"); },
  test_deposit_increases_balance() { const a = new Account(); a.deposit("10.50"); eq(a.getBalance(), "10.50"); },
  test_multiple_deposits_update_balance() { const a = new Account(); a.deposit("3.10"); a.deposit("3.20"); eq(a.getBalance(), "6.30"); },
  test_withdraw_decreases_balance() { const a = new Account(); a.deposit("20.00"); a.withdraw("5.25"); eq(a.getBalance(), "14.75"); },
  test_cannot_withdraw_more_than_balance() { const a = new Account(); a.deposit("10.00"); raises(() => a.withdraw("15.00"), "Insufficient funds"); },
  test_cannot_deposit_zero_or_negative_amount() { const a = new Account(); raises(() => a.deposit("0")); raises(() => a.deposit("-5.00")); },
  test_cannot_withdraw_zero_or_negative_amount() { const a = new Account(); raises(() => a.withdraw("0")); raises(() => a.withdraw("-5.00")); },
  test_invalid_amount_raises_error() { raises(() => new Account().deposit("abc")); },
};
(function runTests() {
  const ul = document.getElementById("tests"); let passed = 0;
  for (const [name, fn] of Object.entries(TESTS)) {
    const li = document.createElement("li");
    try { fn(); passed++; li.innerHTML = `<span class="pass">✓</span><span></span>`; li.lastChild.textContent = name; }
    catch (e) { li.innerHTML = `<span class="fail">✗</span><span></span>`; li.lastChild.textContent = `${name} — ${e.message}`; }
    ul.appendChild(li);
  }
  const total = Object.keys(TESTS).length, score = document.getElementById("score");
  score.textContent = `${passed}/${total} passing`;
  if (passed !== total) { score.classList.add("bad"); document.getElementById("checks").open = true; }
})();

// ---- app state ----
const KEY = "pocket-ledger-v1";
const SAMPLE = [
  { t: "in",  c: "250000", at: Date.now() - 86400000 * 3 },
  { t: "out", c: "4275",   at: Date.now() - 86400000 * 2 },
  { t: "out", c: "1250",   at: Date.now() - 86400000 },
];
let entries, isSample = false;
try { entries = JSON.parse(localStorage.getItem(KEY)); } catch { entries = null; }
if (!Array.isArray(entries)) { entries = SAMPLE; isSample = true; }

function save() { try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch {} }
function replay() {
  const a = new Account();
  for (const e of entries) { const s = Account.format(BigInt(e.c)); e.t === "in" ? a.deposit(s) : a.withdraw(s); }
  return a;
}
let account = replay();

const $ = id => document.getElementById(id);
const money = c => Account.format(BigInt(c), true);
const fmtDate = ts => new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function render() {
  $("balance").textContent = "$" + money(account.cents);
  let inc = 0n, out = 0n; for (const e of entries) e.t === "in" ? inc += BigInt(e.c) : out += BigInt(e.c);
  $("count").textContent = `${entries.length} ${entries.length === 1 ? "entry" : "entries"}${isSample ? " · example data" : ""}`;
  $("totals").textContent = entries.length ? `In $${money(inc)} · Out $${money(out)}` : "";
  const rows = $("rows"); rows.innerHTML = "";
  if (!entries.length) {
    rows.innerHTML = `<li class="empty">No entries yet. Type an amount and tap Deposit to open the account.</li>`;
    return;
  }
  let run = 0n; const items = [];
  for (const e of entries) {
    run += e.t === "in" ? BigInt(e.c) : -BigInt(e.c);
    const li = document.createElement("li"); li.className = "row";
    li.innerHTML = `<span class="tag ${e.t}">${e.t === "in" ? "DEP" : "WDR"}</span>
      <time>${fmtDate(e.at)}</time>
      <span class="amt num ${e.t}">${e.t === "in" ? "+" : "−"}${money(e.c)}</span>
      <span class="run num">bal ${money(run)}</span>`;
    items.push(li);
  }
  items.reverse().forEach(li => rows.appendChild(li));
}

function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }

function act(kind) {
  const raw = $("amount").value;
  try {
    const cents = Account.toCents(raw);
    const target = isSample ? new Account() : account;  // example data is dropped on the first real entry
    kind === "deposit" ? target.deposit(raw) : target.withdraw(raw);
    if (isSample) { entries = []; isSample = false; account = target; }
    entries.push({ t: kind === "deposit" ? "in" : "out", c: cents.toString(), at: Date.now() });
    save();
    say(`${kind === "deposit" ? "Deposited" : "Withdrew"} $${money(cents)}.`, "ok");
    $("amount").value = "";
  } catch (e) {
    say(e.message === "Insufficient funds" ? `Insufficient funds. You can withdraw up to $${money(account.cents)}.` : e.message + ".", "err");
  }
  render();
}

$("pad").addEventListener("submit", e => { e.preventDefault(); act("deposit"); });
$("wd").addEventListener("click", () => act("withdraw"));
$("chips").addEventListener("click", e => { const v = e.target.dataset.v; if (v) { $("amount").value = Number(v).toFixed(2); $("amount").focus(); } });

function showReset() {
  $("resetArea").innerHTML = `<button type="button" class="link" id="reset">Start a new account</button>`;
  $("reset").addEventListener("click", () => {
    $("resetArea").innerHTML = `<span class="confirm">Erase all entries?
      <button type="button" class="danger" id="yes">Erase</button><button type="button" id="no">Keep</button></span>`;
    $("yes").addEventListener("click", () => { entries = []; isSample = false; account = new Account(); save(); render(); say("Started a new account.", "ok"); showReset(); });
    $("no").addEventListener("click", showReset);
  });
}
showReset();
render();
if (isSample) say("Showing example entries. Your first deposit or withdrawal replaces them.");
</script>
</body>
</html>
